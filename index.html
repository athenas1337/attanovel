<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/attanovel/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AttaNovel - Platform menulis dan membaca novel terbaik. Tulis, terbitkan, dan nikmati ribuan cerita menarik dari penulis berbakat Indonesia." />
    <meta name="keywords" content="novel, menulis novel, baca novel, platform novel, AttaNovel, cerita, fiksi, fantasy, romance, action" />
    <meta name="author" content="AttaNovel" />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph -->
    <meta property="og:title" content="AttaNovel - Platform Menulis & Membaca Novel" />
    <meta property="og:description" content="Tulis dan baca novel di AttaNovel. Platform terbaik untuk para penulis dan pembaca Indonesia." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://attanovel.my.id" />
    <meta property="og:image" content="https://attanovel.my.id/og-image.png" />
    <meta property="og:locale" content="id_ID" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AttaNovel - Platform Menulis Novel" />
    <meta name="twitter:description" content="Tulis dan baca novel di AttaNovel. Platform terbaik untuk penulis Indonesia." />
    <meta name="theme-color" content="#6d28d9" />
    <title>AttaNovel - Platform Menulis &amp; Membaca Novel</title>
    <!-- Canonical — change to your .my.id domain when live -->

    <link rel="canonical" href="https://attanovel.my.id" />
    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AttaNovel",
      "url": "https://attanovel.my.id",
      "description": "Platform menulis dan membaca novel Indonesia terbaik",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://attanovel.my.id/discover?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Google AdSense — SIAP PAKAI. Ganti ca-pub-XXXXXXXXXX dengan Publisher ID Anda -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX" crossorigin="anonymous"></script> -->
    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- GitHub Pages SPA redirect decode: restores paths from query string -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- Inline loading screen — visible until React mounts -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: #0b0817;
        color: #ede9fe;
        font-family: Inter, 'Segoe UI', sans-serif;
      }
      #root { min-height: 100vh; }
      /* Splash screen shown before React loads */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0817;
        z-index: 9999;
        gap: 16px;
        transition: opacity 0.4s ease;
      }
      #splash .splash-logo {
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #a78bfa, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }
      #splash .splash-sub {
        font-size: 0.85rem;
        color: #7c6fa0;
      }
      #splash .splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(139,92,246,0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash screen that hides after React mounts -->
    <div id="splash">
      <div class="splash-logo">📖 AttaNovel</div>
      <div class="splash-sub">Memuat platform...</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Hide splash once React takes over -->
    <script>
      // Remove splash after React has had time to render
      window.addEventListener('DOMContentLoaded', function() {
        // Use requestAnimationFrame to detect when React has painted
        var checkReady = function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var splash = document.getElementById('splash');
            if (splash) {
              splash.style.opacity = '0';
              setTimeout(function() {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
              }, 400);
            }
          } else {
            requestAnimationFrame(checkReady);
          }
        };
        requestAnimationFrame(checkReady);
      });
    </script>
  </body>
</html>
